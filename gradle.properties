# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Minecraft
# minecraft_version: local compile target (latest patch; MC is backwards-compat with 26.1).
# minecraft_min_version drives the declared mod compat range and the FDR/AppleSkin coords
# (those mods publish against base 26.1 only).
minecraft_version = 26.1.2
minecraft_min_version = 26.1
minecraft_max_version = 26.1.2

# Fabric
fabric_loader_version = 0.19.2
fabric_api_version = 0.148.0+26.1.2

## Mod info
mod_id=eastersdelight
mod_version=1.3.0
mod_group_id=com.phantomwing.eastersdelight

# Dependencies
appleskin_version = 3.0.9
farmersdelight_version = 3.6.3
cloth_config_version = 26.1.154
# JEI publishes per-patch artifacts (jei-26.1.X-fabric); pin the patch version here.
jei_minecraft_version = 26.1.2
jei_version = 29.5.0.28
# REI: no 26.1 build yet — placeholder pinned at last 1.21.11 release
rei_version = 21.11.814+fabric

# Publishing
# Every game version tagged on the upload, not just the compile target.
supported_minecraft_versions = 26.1 26.1.1 26.1.2
modrinth_project_id = Eg1DyRej
curseforge_project_id = 1230799
