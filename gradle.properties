# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Minecraft
# minecraft_version: local compile target (latest patch).
# minecraft_min_version drives the declared mod compat range and the FDR/AppleSkin coords
# (those mods publish against the base version only).
minecraft_version = 26.3
minecraft_min_version = 26.3
minecraft_max_version = 26.3

# Fabric
fabric_loader_version = 0.19.5
fabric_api_version = 0.161.0+26.3

## Mod info
mod_id=eastersdelight
mod_version=1.3.1
mod_group_id=com.phantomwing.eastersdelight

# Dependencies
appleskin_version = 3.0.10
# FDR comes from the Modrinth maven as <mc>-<fdr>; the Greenhouse maven stops at 26.2.
farmersdelight_version = 3.6.27
cloth_config_version = 26.3.158
# JEI publishes per-patch artifacts (jei-26.3.X-fabric); pin the patch version here.
jei_minecraft_version = 26.3
jei_version = 31.8.0.53
# REI: no 26.x build yet, placeholder pinned at last 1.21.11 release
rei_version = 21.11.814+fabric

# Publishing
# Every game version tagged on the upload, not just the compile target.
supported_minecraft_versions = 26.3
modrinth_project_id = Eg1DyRej
curseforge_project_id = 1230799
