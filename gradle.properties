# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# Minecraft
# FD 1.3.x only ships for 1.21.1 (no 1.3 build for plain 1.21). NeoForge 21.1.x already targets
# 1.21.1, so this is effectively a string bump — no MC API delta from 1.21 → 1.21.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.230
neo_version_range=[21.1.219,)
loader_version_range=[4,)

## Mod info
mod_version=1.2.1
mod_id=eastersdelight
mod_group_id=com.phantomwing.eastersdelight
mod_license=All Rights Reserved
mod_name=Easter's Delight
mod_description=A cute add-on for Farmer's Delight adding egg painting and easter-themed foods!
mod_authors=PhantomWing

# Main dependencies
# CurseForge file 8083481 = Farmer's Delight 1.3.2 for NeoForge 1.21.1.
farmersdelight_version=8083481
farmersdelight_version_range=[1.3,)

# Other dependencies
