plugins {
    // 26.1: Loom plugin id is now namespaced; ClassTweaker support is in 1.16-SNAPSHOT.
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = mod_version
group = mod_group_id

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
    // Use min compat version in the jar name to communicate broad compat range.
    archivesName = "${mod_id}-fabric-${minecraft_min_version}"
}

repositories {
    mavenLocal()

    maven {
        // Farmer's Delight Refabricated
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }

    maven { // Fabric ASM
        url = "https://jitpack.io/"
    }

    maven {
        // CraftTweaker, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven { url "https://maven.ryanliptak.com/" } // AppleSkin
    maven { url = "https://maven.shedaniel.me/" } // REI and deps

    maven { url 'https://www.cursemaven.com' }
}

fabricApi {
    configureDataGeneration() {
        strictValidation = false
        createSourceSet = true
        modId = mod_id
        client = true
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Fabric — 26.1 is Mojmap-only (no obfuscation), so no remapping needed: use plain
    // implementation/api/runtimeOnly instead of the mod* variants.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Farmer's Delight Refabricated — published against base MC (no per-patch artifacts).
    implementation("vectorwing:FarmersDelight:${minecraft_min_version}-${farmersdelight_version}+refabricated") {
        exclude(group: "net.fabricmc")
    }

    // Cloth Config API
    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // JEI / REI — REI has no 26.1 build yet (last: 21.11.814 for 1.21.11).
    runtimeOnly("mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}")
    //runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")

    // Appleskin — published against base MC.
    runtimeOnly("squeek.appleskin:appleskin-fabric:mc${minecraft_min_version}-${appleskin_version}")
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,

            mod_id               : mod_id,
            mod_version          : version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            // Stripped of the +build suffix for a clean dependency predicate (0.148.0+26.1.2 -> 0.148.0).
            fabric_api_dep       : fabric_api_version.replaceAll(/\+.*$/, ''),
            cloth_config_version : cloth_config_version,
            farmersdelight_dep   : "${minecraft_min_version}-${farmersdelight_version}"
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
    }
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
    def f = file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

// Modrinth / CurseForge publishing. Dry run (no upload): ./gradlew publishMods -PpublishDryRun
// A real upload needs modrinth_token / curseforge_token in ~/.gradle/gradle.properties (or the
// MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
publishMods {
    // 26.x is unobfuscated: loom has no remapJar, so the `jar` task is the final mod artifact.
    file = tasks.named("jar", Jar).flatMap { it.archiveFile }
    version = project.mod_version
    displayName = "Easter's Delight ${project.mod_version}"
    changelog = project.ext.latestChangelog()
    type = STABLE
    modLoaders.add("fabric")
    // -PpublishDryRun => stage to build/ without uploading.
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        requires("fabric-api")
        requires("cloth-config")
        requires("farmers-delight-refabricated")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("fabric-api")
        requires("cloth-config")
        requires("farmers-delight-refabricated")
    }
}
