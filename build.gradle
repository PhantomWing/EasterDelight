plugins {
    // Loom 1.9+ adds ClassTweaker support (the .classtweaker format FDR 3.3+ ships
    // instead of legacy .accesswidener). Matched to RusticDelight-Fabric fabric/1.21
    // (requires Gradle 9.x — see gradle-wrapper.properties).
    id 'fabric-loom' version '1.17.0-alpha.7'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    mavenLocal()

    // Local patched FDR jar (libs/farmers-delight-refabricated-<mc>-<ver>-patched.jar). The
    // upstream FDR ships a .classtweaker with enum extensions that crash Loom 1.16+ remap with
    // NPE in EnumExtensionClassVisitor.visitEnd; the patched copy strips those extensions.
    flatDir {
        dirs 'libs'
    }

    maven {
        // Farmer's Delight Refabricated (Modrinth Maven) — kept as a fallback even though we
        // use the local patched jar for compilation, in case a future Loom can consume upstream.
        url = "https://api.modrinth.com/maven"
    }

    maven { // Fabric ASM
        url = "https://jitpack.io/"
    }

    maven {
        // CraftTweaker, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven { url "https://maven.ryanliptak.com/" } // AppleSkin
    maven { url = "https://maven.shedaniel.me/" } // REI and deps

    maven { url 'https://www.cursemaven.com' }
    maven { url = "https://maven.parchmentmc.org" }
}

fabricApi {
    // Scope datagen to our mod only — otherwise Fabric/Loom also runs FDR's own data generators,
    // which write into src/main/generated/ and treat our previous files as stale.
    configureDataGeneration {
        modId = mod_id
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

    // Parchment
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }

    // Farmer's Delight Refabricated (local patched jar — see flatDir comment in repositories block).
    modImplementation(name: "farmers-delight-refabricated-${minecraft_version}-${farmersdelight_version}-patched") {
        exclude(group: "net.fabricmc")
    }

    // Cloth Config API
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // JEI
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    //modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")

    // Appleskin
    modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_min_version: minecraft_min_version,
            minecraft_max_version: minecraft_max_version,

            mod_id               : mod_id,
            mod_version          : version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}